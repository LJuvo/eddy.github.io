<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesium 动态定位平台</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Widgets/widgets.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #cesiumContainer {
            width: 100%;
            height: 100%;
        }
        .toolbar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            min-width: 280px;
            z-index: 100;
        }
        .toolbar h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1e88e5;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1e88e5, #1565c0);
            color: white;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #1976d2, #1565c0);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .quick-locate {
            margin: 15px 0;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .quick-label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }
        .btn-city {
            display: inline-block;
            width: auto;
            padding: 8px 16px;
            margin-right: 8px;
            margin-bottom: 8px;
            background: #f0f7ff;
            color: #1e88e5;
            font-size: 13px;
            border: 1px solid #bbdefb;
            border-radius: 20px;
        }
        .btn-city:hover {
            background: #1e88e5;
            color: white;
            border-color: #1e88e5;
        }
        .status-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 100;
        }
        .coord-display {
            margin-bottom: 5px;
        }
        .coord-label {
            display: inline-block;
            width: 60px;
            color: #aaa;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            font-size: 12px;
            z-index: 100;
        }
        .legend h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .legend-color {
            width: 20px;
            height: 12px;
            border-radius: 2px;
            margin-right: 8px;
        }
        .marker-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            font-size: 12px;
            z-index: 100;
            min-width: 200px;
        }
        .marker-info h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }
        .marker-info .info-row {
            margin-bottom: 6px;
        }
        .marker-info .info-label {
            color: #888;
            margin-right: 5px;
        }
        .draw-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .section-title {
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 12px;
        }
        .draw-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .btn-draw {
            flex: 1;
            padding: 10px;
            background: #fff;
            color: #555;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-draw:hover {
            border-color: #1e88e5;
            color: #1e88e5;
        }
        .btn-draw.active {
            background: #1e88e5;
            color: white;
            border-color: #1e88e5;
        }
        .btn-draw-action {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: none;
        }
        .btn-finish {
            background: #4caf50;
            color: white;
        }
        .btn-finish:hover {
            background: #43a047;
        }
        .btn-clear {
            background: #f5f5f5;
            color: #f44336;
        }
        .btn-clear:hover {
            background: #ffebee;
        }
        .draw-status {
            font-size: 12px;
            color: #888;
            text-align: center;
            padding: 8px;
            background: #f9f9f9;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    
    <div class="toolbar">
        <h2>📍 动态定位</h2>
        <div class="form-group">
            <label>经度 (Longitude)</label>
            <input type="number" id="lonInput" placeholder="请输入经度" step="0.0001" value="116.3975">
        </div>
        <div class="form-group">
            <label>纬度 (Latitude)</label>
            <input type="number" id="latInput" placeholder="请输入纬度" step="0.0001" value="39.9087">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>高度 (Height)</label>
                <input type="number" id="heightInput" placeholder="请输入高度" value="5000">
            </div>
            <div class="form-group">
                <label>视角 (Heading)</label>
                <input type="number" id="headingInput" placeholder="请输入视角" value="0">
            </div>
        </div>
        <button class="btn btn-primary" onclick="locate()">定位</button>
        <div class="quick-locate">
            <span class="quick-label">快捷定位:</span>
            <button class="btn btn-city" onclick="quickLocate('beijing')">北京</button>
            <button class="btn btn-city" onclick="quickLocate('shanghai')">上海</button>
            <button class="btn btn-city" onclick="quickLocate('chengdu')">成都</button>
        </div>
        <button class="btn btn-secondary" onclick="addMarker()">添加标记点</button>
        <button class="btn btn-secondary" onclick="clearMarkers()">清除标记</button>

        <div class="draw-section">
            <div class="section-title">✏️ 绘制工具</div>
            <div class="draw-buttons">
                <button class="btn btn-draw" id="btnPoint" onclick="startDraw('point')">点</button>
                <button class="btn btn-draw" id="btnLine" onclick="startDraw('line')">线</button>
                <button class="btn btn-draw" id="btnPolygon" onclick="startDraw('polygon')">面</button>
            </div>
            <div class="draw-buttons">
                <button class="btn btn-draw-action btn-finish" onclick="finishDraw()">完成</button>
                <button class="btn btn-draw-action btn-clear" onclick="clearDrawings()">清除绘制</button>
            </div>
            <div class="draw-status" id="drawStatus">点击按钮开始绘制</div>
        </div>
    </div>

    <div class="status-bar">
        <div class="coord-display">
            <span class="coord-label">经度:</span>
            <span id="currentLon">--</span>
        </div>
        <div class="coord-display">
            <span class="coord-label">纬度:</span>
            <span id="currentLat">--</span>
        </div>
        <div class="coord-display">
            <span class="coord-label">高度:</span>
            <span id="currentHeight">--</span>
        </div>
    </div>

    <div class="legend">
        <h3>图例</h3>
        <div class="legend-item">
            <div class="legend-color" style="background: rgba(255, 0, 0, 0.8);"></div>
            <span>定位标记点</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: rgba(0, 128, 255, 0.8);"></div>
            <span>用户添加标记</span>
        </div>
    </div>

    <div class="marker-info" id="markerInfo" style="display: none;">
        <h3>标记信息</h3>
        <div class="info-row">
            <span class="info-label">经度:</span>
            <span id="markerLon">--</span>
        </div>
        <div class="info-row">
            <span class="info-label">纬度:</span>
            <span id="markerLat">--</span>
        </div>
        <div class="info-row">
            <span class="info-label">高度:</span>
            <span id="markerHeight">--</span>
        </div>
    </div>

    <script>
        const terrainBaseUrl = 'https://shapezo.gisbox.com.cn/api/v1/gis/terrain';
        const imageryUrl = 'https://shapezo.gisbox.com.cn/api/v1/gis/imagery-tile/{z}/{x}/{y}';

        // 城市预设坐标
        const cityPresets = {
            beijing: { name: '北京', lon: 116.3975, lat: 39.9087, height: 5000, heading: 0 },
            shanghai: { name: '上海', lon: 121.4737, lat: 31.2304, height: 5000, heading: 0 },
            chengdu: { name: '成都', lon: 104.0668, lat: 30.5728, height: 5000, heading: 0 }
        };

        let viewer = null;
        let markers = [];
        let currentPositionMarker = null;

        // 绘制相关状态
        let drawMode = null; // 'point', 'line', 'polygon'
        let drawingEntities = []; // 已完成的绘制实体
        let tempPoints = []; // 临时点坐标(Cartesian3数组)
        let tempPointEntities = []; // 临时点实体
        let tempLineEntity = null; // 临时线实体
        let tempPolygonEntity = null; // 临时面实体
        let drawHandler = null; // 绘制事件处理器

        // 异步初始化Viewer
        async function initViewer() {
            // 使用 fromUrl 异步创建地形提供者，传入基础URL（layer.json 所在目录）
            const terrainProvider = await Cesium.CesiumTerrainProvider.fromUrl(terrainBaseUrl, {
                requestVertexNormals: true,
                requestWaterMask: true
            });

            viewer = new Cesium.Viewer('cesiumContainer', {
                animation: true,
                baseLayerPicker: false,
                fullscreenButton: true,
                geocoder: false,
                homeButton: true,
                infoBox: false,
                sceneModePicker: true,
                selectionIndicator: false,
                timeline: true,
                navigationHelpButton: true,
                navigationInstructionsInitiallyVisible: false,
                terrainProvider: terrainProvider,
                imageryProvider: false
            });

            // 添加XYZ格式的影像图层 - 使用 {z}/{x}/{y} 模板
            viewer.imageryLayers.addImageryProvider(
                new Cesium.UrlTemplateImageryProvider({
                    url: imageryUrl,
                    maximumLevel: 18,
                    minimumLevel: 0,
                    credit: 'GISBOX Terrain & Imagery',
                    tilingScheme: new Cesium.WebMercatorTilingScheme()
                })
            );

            // 开启地形深度测试
            viewer.scene.globe.depthTestAgainstTerrain = true;

            // 实时坐标显示
            viewer.scene.postRender.addEventListener(() => {
                const cameraPosition = viewer.camera.positionCartographic;
                if (cameraPosition) {
                    document.getElementById('currentLon').textContent = Cesium.Math.toDegrees(cameraPosition.longitude).toFixed(6);
                    document.getElementById('currentLat').textContent = Cesium.Math.toDegrees(cameraPosition.latitude).toFixed(6);
                    document.getElementById('currentHeight').textContent = cameraPosition.height.toFixed(2) + 'm';
                }
            });

            // 点击标记显示信息
            viewer.screenSpaceEventHandler.setInputAction((click) => {
                const pickedObject = viewer.scene.pick(click.position);
                if (pickedObject && pickedObject.id && pickedObject.id.label) {
                    const position = pickedObject.id.position.getValue(viewer.clock.currentTime);
                    if (position) {
                        const cartographic = Cesium.Cartographic.fromCartesian(position);
                        showMarkerInfo(
                            Cesium.Math.toDegrees(cartographic.longitude),
                            Cesium.Math.toDegrees(cartographic.latitude),
                            cartographic.height
                        );
                    }
                } else {
                    document.getElementById('markerInfo').style.display = 'none';
                }
            }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

            // 设置初始视角 - 北京
            viewer.camera.setView({
                destination: Cesium.Cartesian3.fromDegrees(116.3975, 39.9087, 10000),
                orientation: {
                    heading: Cesium.Math.toRadians(0),
                    pitch: Cesium.Math.toRadians(-60),
                    roll: 0.0
                }
            });

            // 键盘快捷键
            document.getElementById('lonInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') locate();
            });
            document.getElementById('latInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') locate();
            });
            document.getElementById('heightInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') locate();
            });

            // 初始化绘制事件处理器
            drawHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        }

        // ==================== 绘制功能 ====================

        function startDraw(mode) {
            if (!viewer || !drawHandler) return;

            // 先清除之前的临时绘制
            clearTempDrawings();

            // 如果点击的是当前模式，则取消绘制
            if (drawMode === mode) {
                drawMode = null;
                updateDrawButtons();
                updateDrawStatus('点击按钮开始绘制');
                return;
            }

            drawMode = mode;
            updateDrawButtons();

            const statusTexts = {
                point: '点击地图添加点，双击或点击"完成"结束',
                line: '点击地图添加节点，双击或点击"完成"结束绘制',
                polygon: '点击地图添加节点，双击或点击"完成"闭合图形'
            };
            updateDrawStatus(statusTexts[mode]);

            // 注册点击事件
            drawHandler.setInputAction((click) => {
                const cartesian = viewer.scene.pickPosition(click.position);
                if (!cartesian) return;

                // 贴地处理
                const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
                const groundPosition = Cesium.Cartesian3.fromDegrees(
                    Cesium.Math.toDegrees(cartographic.longitude),
                    Cesium.Math.toDegrees(cartographic.latitude),
                    0
                );

                handleDrawClick(groundPosition);
            }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

            // 注册鼠标移动事件（用于临时线/面预览）
            drawHandler.setInputAction((movement) => {
                if (drawMode !== 'line' && drawMode !== 'polygon') return;
                if (tempPoints.length === 0) return;

                const cartesian = viewer.scene.pickPosition(movement.endPosition);
                if (!cartesian) return;

                const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
                const groundPosition = Cesium.Cartesian3.fromDegrees(
                    Cesium.Math.toDegrees(cartographic.longitude),
                    Cesium.Math.toDegrees(cartographic.latitude),
                    0
                );

                updateTempDrawing(groundPosition);
            }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

            // 双击结束绘制
            drawHandler.setInputAction(() => {
                finishDraw();
            }, Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
        }

        function handleDrawClick(position) {
            if (drawMode === 'point') {
                // 点模式：每次点击创建一个点
                const pointEntity = viewer.entities.add({
                    position: position,
                    point: {
                        pixelSize: 12,
                        color: Cesium.Color.ORANGE,
                        outlineColor: Cesium.Color.WHITE,
                        outlineWidth: 2,
                        disableDepthTestDistance: Number.POSITIVE_INFINITY
                    }
                });
                drawingEntities.push(pointEntity);
                updateDrawStatus('已添加点，继续点击添加更多点，或点击"完成"结束');

            } else if (drawMode === 'line' || drawMode === 'polygon') {
                // 线/面模式：添加节点
                tempPoints.push(position);

                // 添加临时节点点
                const tempPoint = viewer.entities.add({
                    position: position,
                    point: {
                        pixelSize: 8,
                        color: Cesium.Color.YELLOW,
                        outlineColor: Cesium.Color.WHITE,
                        outlineWidth: 2,
                        disableDepthTestDistance: Number.POSITIVE_INFINITY
                    }
                });
                tempPointEntities.push(tempPoint);

                const count = tempPoints.length;
                if (drawMode === 'line') {
                    updateDrawStatus(`已添加 ${count} 个节点，继续点击添加，双击结束`);
                } else {
                    updateDrawStatus(`已添加 ${count} 个节点，至少需要3个点，双击闭合`);
                }

                // 更新临时线/面
                updateTempDrawing(position);
            }
        }

        function updateTempDrawing(mousePosition) {
            if (!drawMode || tempPoints.length === 0) return;

            const positions = [...tempPoints, mousePosition];

            if (drawMode === 'line') {
                // 更新临时线
                if (tempLineEntity) {
                    viewer.entities.remove(tempLineEntity);
                }
                tempLineEntity = viewer.entities.add({
                    polyline: {
                        positions: positions,
                        width: 3,
                        material: Cesium.Color.CYAN.withAlpha(0.8),
                        clampToGround: true
                    }
                });
            } else if (drawMode === 'polygon') {
                // 更新临时面
                if (tempPolygonEntity) {
                    viewer.entities.remove(tempPolygonEntity);
                }
                if (tempLineEntity) {
                    viewer.entities.remove(tempLineEntity);
                }
                if (positions.length >= 3) {
                    const polyPositions = [...tempPoints, mousePosition, tempPoints[0]];
                    tempLineEntity = viewer.entities.add({
                        polyline: {
                            positions: polyPositions,
                            width: 2,
                            material: Cesium.Color.CYAN.withAlpha(0.8),
                            clampToGround: true
                        }
                    });
                    tempPolygonEntity = viewer.entities.add({
                        polygon: {
                            hierarchy: positions,
                            material: Cesium.Color.CYAN.withAlpha(0.3),
                            outline: true,
                            outlineColor: Cesium.Color.CYAN,
                            perPositionHeight: true
                        }
                    });
                }
            }
        }

        function finishDraw() {
            if (!viewer || !drawMode) return;

            if (drawMode === 'point') {
                // 点模式：直接结束
                drawMode = null;
                clearTempDrawings();
                updateDrawButtons();
                updateDrawStatus(`绘制完成，共添加 ${drawingEntities.length} 个点`);

            } else if (drawMode === 'line') {
                if (tempPoints.length >= 2) {
                    // 创建最终的线
                    const lineEntity = viewer.entities.add({
                        polyline: {
                            positions: tempPoints,
                            width: 4,
                            material: Cesium.Color.ORANGE,
                            clampToGround: true
                        }
                    });
                    drawingEntities.push(lineEntity);
                    updateDrawStatus(`线绘制完成，共 ${tempPoints.length} 个节点`);
                } else {
                    updateDrawStatus('线至少需要2个点');
                }
                drawMode = null;
                clearTempDrawings();
                updateDrawButtons();

            } else if (drawMode === 'polygon') {
                if (tempPoints.length >= 3) {
                    // 创建最终的面
                    const polygonEntity = viewer.entities.add({
                        polygon: {
                            hierarchy: tempPoints,
                            material: Cesium.Color.ORANGE.withAlpha(0.4),
                            outline: true,
                            outlineColor: Cesium.Color.ORANGE,
                            outlineWidth: 3,
                            perPositionHeight: true
                        }
                    });
                    drawingEntities.push(polygonEntity);

                    // 添加边线
                    const outlinePositions = [...tempPoints, tempPoints[0]];
                    const outlineEntity = viewer.entities.add({
                        polyline: {
                            positions: outlinePositions,
                            width: 3,
                            material: Cesium.Color.ORANGE,
                            clampToGround: true
                        }
                    });
                    drawingEntities.push(outlineEntity);

                    updateDrawStatus(`面绘制完成，共 ${tempPoints.length} 个节点`);
                } else {
                    updateDrawStatus('面至少需要3个点');
                }
                drawMode = null;
                clearTempDrawings();
                updateDrawButtons();
            }

            // 移除绘制事件监听
            if (drawHandler) {
                drawHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_CLICK);
                drawHandler.removeInputAction(Cesium.ScreenSpaceEventType.MOUSE_MOVE);
                drawHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
            }
        }

        function clearTempDrawings() {
            if (!viewer) return;

            // 移除临时点
            tempPointEntities.forEach(p => viewer.entities.remove(p));
            tempPointEntities = [];

            // 移除临时线
            if (tempLineEntity) {
                viewer.entities.remove(tempLineEntity);
                tempLineEntity = null;
            }

            // 移除临时面
            if (tempPolygonEntity) {
                viewer.entities.remove(tempPolygonEntity);
                tempPolygonEntity = null;
            }

            tempPoints = [];
        }

        function clearDrawings() {
            if (!viewer) return;

            // 清除所有已完成的绘制实体
            drawingEntities.forEach(e => viewer.entities.remove(e));
            drawingEntities = [];

            // 清除临时绘制
            clearTempDrawings();

            // 如果正在绘制，也取消
            if (drawMode && drawHandler) {
                drawMode = null;
                drawHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_CLICK);
                drawHandler.removeInputAction(Cesium.ScreenSpaceEventType.MOUSE_MOVE);
                drawHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
                updateDrawButtons();
            }

            updateDrawStatus('已清除所有绘制');
        }

        function updateDrawButtons() {
            ['point', 'line', 'polygon'].forEach(mode => {
                const btn = document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1));
                if (btn) {
                    if (drawMode === mode) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            });
        }

        function updateDrawStatus(text) {
            const el = document.getElementById('drawStatus');
            if (el) el.textContent = text;
        }

        function createPoint(position, color, scale = 1) {
            if (!viewer) return null;
            return viewer.entities.add({
                position: position,
                point: {
                    pixelSize: 15 * scale,
                    color: color,
                    outlineColor: Cesium.Color.WHITE,
                    outlineWidth: 2,
                    disableDepthTestDistance: Number.POSITIVE_INFINITY
                },
                label: {
                    show: false,
                    font: '14px Microsoft YaHei',
                    fillColor: Cesium.Color.WHITE,
                    outlineColor: Cesium.Color.BLACK,
                    outlineWidth: 2,
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                    pixelOffset: new Cesium.Cartesian2(0, -20)
                }
            });
        }

        function locate() {
            if (!viewer) return;

            const lon = parseFloat(document.getElementById('lonInput').value);
            const lat = parseFloat(document.getElementById('latInput').value);
            const height = parseFloat(document.getElementById('heightInput').value) || 5000;
            const heading = parseFloat(document.getElementById('headingInput').value) || 0;

            if (isNaN(lon) || isNaN(lat)) {
                alert('请输入有效的经纬度');
                return;
            }

            const destination = Cesium.Cartesian3.fromDegrees(lon, lat, height);
            
            viewer.camera.flyTo({
                destination: destination,
                orientation: {
                    heading: Cesium.Math.toRadians(heading),
                    pitch: Cesium.Math.toRadians(-45),
                    roll: 0.0
                },
                duration: 2.0,
                easingFunction: Cesium.EasingFunction.CUBIC_IN_OUT
            });

            if (currentPositionMarker) {
                viewer.entities.remove(currentPositionMarker);
            }
            currentPositionMarker = createPoint(destination, Cesium.Color.RED);
        }

        function quickLocate(cityKey) {
            if (!viewer) return;

            const city = cityPresets[cityKey];
            if (!city) return;

            document.getElementById('lonInput').value = city.lon;
            document.getElementById('latInput').value = city.lat;
            document.getElementById('heightInput').value = city.height;
            document.getElementById('headingInput').value = city.heading;

            const destination = Cesium.Cartesian3.fromDegrees(city.lon, city.lat, city.height);
            
            viewer.camera.flyTo({
                destination: destination,
                orientation: {
                    heading: Cesium.Math.toRadians(city.heading),
                    pitch: Cesium.Math.toRadians(-45),
                    roll: 0.0
                },
                duration: 2.0,
                easingFunction: Cesium.EasingFunction.CUBIC_IN_OUT
            });

            if (currentPositionMarker) {
                viewer.entities.remove(currentPositionMarker);
            }
            currentPositionMarker = createPoint(destination, Cesium.Color.RED);
            if (currentPositionMarker) {
                currentPositionMarker.label.show = true;
                currentPositionMarker.label.text = city.name;
            }
        }

        function addMarker() {
            if (!viewer) return;

            const lon = parseFloat(document.getElementById('lonInput').value);
            const lat = parseFloat(document.getElementById('latInput').value);
            const height = parseFloat(document.getElementById('heightInput').value) || 0;

            if (isNaN(lon) || isNaN(lat)) {
                alert('请输入有效的经纬度');
                return;
            }

            const position = Cesium.Cartesian3.fromDegrees(lon, lat, height);
            const marker = createPoint(position, Cesium.Color.fromCssColorString('rgba(0, 128, 255, 0.8)'));
            
            if (marker) {
                marker.label.show = true;
                marker.label.text = `(${lon.toFixed(4)}, ${lat.toFixed(4)})`;
                markers.push(marker);
                showMarkerInfo(lon, lat, height);
            }
        }

        function clearMarkers() {
            if (!viewer) return;

            markers.forEach(marker => {
                viewer.entities.remove(marker);
            });
            markers = [];
            document.getElementById('markerInfo').style.display = 'none';
        }

        function showMarkerInfo(lon, lat, height) {
            document.getElementById('markerLon').textContent = lon.toFixed(6);
            document.getElementById('markerLat').textContent = lat.toFixed(6);
            document.getElementById('markerHeight').textContent = height.toFixed(2) + 'm';
            document.getElementById('markerInfo').style.display = 'block';
        }

        // 启动初始化
        initViewer().catch((error) => {
            console.error('Cesium初始化失败:', error);
            alert('地图初始化失败，请检查网络连接或地形服务地址');
        });
    </script>
</body>
</html>
